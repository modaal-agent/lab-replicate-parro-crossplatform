# The iOS app target: a generated project from a hand-edited spec. `TabShell.xcodeproj` and
# `TabShell/Info.plist` are generated from this file and ignored by git. Adding or removing a source
# file is a change to the tree and a re-run of `xcodegen generate --spec native-swift/xcodegen.yml`,
# never an edit to project.pbxproj. Spec 001 §3.1 lists how this file differs from its reference.
name: TabShell
configs:
  Debug: debug
  Release: release
options:
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions:
  - en
targets:
  TabShell:
    type: application
    platform: iOS
    # Liquid Glass bars and `navigationSubtitle` need iOS 26.0 (spec 001 D4).
    deploymentTarget: '26.0'
    sources:
    - TabShell
    info:
      path: TabShell/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # The system launch screen: no storyboard to maintain.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.modaal.lab.tabshell
        CODE_SIGN_STYLE: Automatic
        # iPhone and iPad from phase 3 (spec 001 D2).
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    supportedDestinations:
    - iOS
